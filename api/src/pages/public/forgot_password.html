<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña - UniGear</title>
  <link rel="stylesheet" href="../../css/globals.css">
  <link rel="stylesheet" href="../../css/components.css">
    <link rel="stylesheet" href="../../css/public/forgot_password.css">
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 9.9-1"/>
            <circle cx="18" cy="6" r="2"/>
          </svg>
        </div>
        <h1>Recuperar contraseña</h1>
        <p>Introduce tu correo institucional</p>
      </div>

      <div id="successMsg" class="success-message">
        Si el correo existe, te enviaremos un enlace para restablecer tu contraseña.
      </div>

      <div id="errorMsg" class="error-message"></div>

      <form id="forgotForm" class="login-form">
        <div class="form-group">
          <label for="email">Correo institucional</label>
          <input type="email" id="email" class="form-input" placeholder="usuario@univ.edu" required>
        </div>

        <button type="submit" id="submitBtn" class="btn-login">Enviar enlace</button>

        <div class="form-options">
          <a href="login.html" style="color: var(--slate-500); text-decoration: none;">Volver al inicio de sesión</a>
        </div>
      </form>
    </div>
  </div>

    <script src="../../js/views/public/forgot_password.js"></script>
</body>
</html>
