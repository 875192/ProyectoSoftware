<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva contraseña - UniGear</title>
  <link rel="stylesheet" href="../../css/globals.css">
  <link rel="stylesheet" href="../../css/components.css">
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #115e59 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      font-family: var(--font-family);
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-wrapper {
      width: 100%;
      padding: 1rem;
      display: flex;
      justify-content: center;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background-color: #ffffff;
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      padding: 1.5rem;
      animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .login-header {
      text-align: center;
      margin-bottom: 1rem;
    }

    .login-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      margin-bottom: 0.25rem;
      background: linear-gradient(135deg, var(--teal-700) 0%, #0d9488 100%);
      border-radius: 10px;
      color: #fff;
      box-shadow: 0 10px 15px -3px rgba(15, 118, 110, 0.3);
    }

    .login-icon svg {
      width: 20px;
      height: 20px;
    }

    .login-header h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--slate-900);
      margin-bottom: 0.15rem;
      letter-spacing: -0.025em;
    }

    .login-header p {
      color: var(--slate-500);
      font-size: 0.8rem;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .form-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--slate-800);
    }

    .form-input {
      width: 100%;
      padding: 0.45rem 0.75rem;
      font-size: 0.9rem;
      color: var(--slate-800);
      background-color: var(--slate-50);
      border: 1px solid var(--slate-200);
      border-radius: 8px;
      transition: all 0.2s;
      box-sizing: border-box;
    }

    .form-input:hover {
      border-color: var(--slate-300);
      background-color: #ffffff;
    }

    .form-input:focus {
      outline: none;
      background-color: #ffffff;
      border-color: var(--teal-700);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.1);
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper .form-input {
      padding-right: 2.5rem;
    }

    .toggle-password {
      position: absolute;
      right: 0.6rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--slate-400);
      padding: 0;
      display: flex;
      align-items: center;
    }

    .toggle-password:hover { color: var(--slate-600); }

    .btn-login {
      margin-top: 0.25rem;
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      background-color: var(--teal-700);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
      width: 100%;
    }

    .btn-login:hover { background-color: #0d9488; }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .form-options {
      text-align: center;
      margin-top: 0.5rem;
      font-size: 0.8rem;
    }

    .success-message {
      display: none;
      padding: 0.75rem;
      background-color: #ecfdf5;
      border: 1px solid #10b981;
      color: #047857;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.8rem;
      text-align: center;
    }

    .error-message {
      display: none;
      padding: 0.75rem;
      background-color: #fef2f2;
      border: 1px solid #f87171;
      color: #b91c1c;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.8rem;
      text-align: center;
    }

    .hint {
      font-size: 0.75rem;
      color: var(--slate-400);
      margin-top: 0.1rem;
    }

    #invalidToken {
      display: none;
      text-align: center;
      padding: 1rem 0;
    }

    #invalidToken p {
      color: var(--slate-500);
      font-size: 0.85rem;
      margin-bottom: 0.75rem;
    }
  </style>
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <h1>Nueva contraseña</h1>
        <p>Elige una contraseña segura para tu cuenta</p>
      </div>

      <!-- Estado: token inválido o ausente -->
      <div id="invalidToken">
        <p>Este enlace es inválido o ha expirado.<br>Solicita uno nuevo.</p>
        <a href="forgot_password.html"
           style="color: var(--teal-700); font-weight: 600; font-size: 0.9rem; text-decoration: none;">
          Volver a recuperar contraseña
        </a>
      </div>

      <!-- Estado: éxito -->
      <div id="successMsg" class="success-message">
        ¡Contraseña actualizada! Ahora puedes iniciar sesión.
      </div>

      <!-- Formulario -->
      <form id="resetForm" class="login-form">
        <div id="errorMsg" class="error-message"></div>

        <div class="form-group">
          <label for="password">Nueva contraseña</label>
          <div class="password-wrapper">
            <input type="password" id="password" class="form-input"
                   placeholder="Mínimo 8 caracteres" required minlength="8">
            <button type="button" class="toggle-password" onclick="toggleVisibility('password', this)" aria-label="Mostrar contraseña">
              <svg id="eyeIcon1" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <span class="hint">Al menos 8 caracteres</span>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmar contraseña</label>
          <div class="password-wrapper">
            <input type="password" id="confirmPassword" class="form-input"
                   placeholder="Repite la contraseña" required>
            <button type="button" class="toggle-password" onclick="toggleVisibility('confirmPassword', this)" aria-label="Mostrar contraseña">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn-login">Guardar contraseña</button>

        <div class="form-options">
          <a href="login.html" style="color: var(--slate-500); text-decoration: none;">Volver al inicio de sesión</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:3000';

    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');

    if (!token) {
      document.getElementById('resetForm').style.display = 'none';
      document.getElementById('invalidToken').style.display = 'block';
    }

    function toggleVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.style.display = 'none';

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        errorMsg.textContent = 'Las contraseñas no coinciden';
        errorMsg.style.display = 'block';
        return;
      }

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Guardando...';

      try {
        const res = await fetch(`${API_BASE}/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          if (res.status === 400 && data.message.includes('inválido')) {
            document.getElementById('resetForm').style.display = 'none';
            document.getElementById('invalidToken').style.display = 'block';
            return;
          }
          throw new Error(data.message || 'Error al actualizar la contraseña');
        }

        document.getElementById('resetForm').style.display = 'none';
        const successMsg = document.getElementById('successMsg');
        successMsg.style.display = 'block';

        // Redirigir al login después de 2 segundos
        setTimeout(() => { window.location.href = 'login.html'; }, 2000);
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Guardar contraseña';
      }
    });
  </script>
</body>
</html>
