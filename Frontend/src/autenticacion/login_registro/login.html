<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniGear | Iniciar Sesión</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="../../compartido/estilos-base/tokens.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="container" id="container">

        <!-- Panel: Crear Cuenta -->
        <div class="form-container sign-up">
            <form id="registerForm" autocomplete="off">
                <h1>Crear Cuenta</h1>
                <div class="social-icons">
                    <button type="button" class="icon google-btn" id="btnGoogleReg" aria-label="Continuar con Google">
                        <svg class="google-logo" viewBox="0 0 18 18" aria-hidden="true">
                            <path fill="#4285F4" d="M17.64 9.2045c0-.6381-.0573-1.2518-.1636-1.8409H9v3.4814h4.8436c-.2086 1.125-.8427 2.0782-1.7959 2.7164v2.2581h2.9087c1.7018-1.5668 2.6836-3.874 2.6836-6.615z"/>
                            <path fill="#34A853" d="M9 18c2.43 0 4.4673-.806 5.9564-2.1805l-2.9087-2.2581c-.806.54-1.8368.8595-3.0477.8595-2.344 0-4.3282-1.5831-5.036-3.7104H.9573v2.3318C2.4382 15.9831 5.4818 18 9 18z"/>
                            <path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.2823-1.1168-.2823-1.71s.1023-1.17.2823-1.71V4.9582H.9573C.3477 6.1732 0 7.5477 0 9s.3477 2.8268.9573 4.0418L3.964 10.71z"/>
                            <path fill="#EA4335" d="M9 3.5795c1.3214 0 2.5077.4541 3.4405 1.346l2.5813-2.5814C13.4632.8918 11.4259 0 9 0 5.4818 0 2.4382 2.0168.9573 4.9582L3.964 7.29C4.6718 5.1627 6.656 3.5795 9 3.5795z"/>
                        </svg>
                    </button>
                </div>
                <span>o usa tu email para registrarte</span>
                <input type="text" id="reg-nombre" placeholder="Nombre completo" required>
                <input type="email" id="reg-email" placeholder="Email" required>
                <input type="password" id="reg-password" placeholder="Contraseña" required>
                <input type="password" id="reg-confirm" placeholder="Confirmar contraseña" required>
                <div class="role-selector">
                    <label class="role-option">
                        <input type="radio" name="reg-rol" value="estudiante" checked>
                        <div class="role-card">
                            <i class="fa-solid fa-graduation-cap"></i>
                            <span>Estudiante</span>
                        </div>
                    </label>
                    <label class="role-option">
                        <input type="radio" name="reg-rol" value="profesor">
                        <div class="role-card">
                            <i class="fa-solid fa-chalkboard-user"></i>
                            <span>Profesor</span>
                        </div>
                    </label>
                </div>
                <p class="error-msg" id="reg-error"></p>
                <button type="submit" id="registerBtn">Registrarse</button>
            </form>
        </div>

        <!-- Panel: Iniciar Sesión -->
        <div class="form-container sign-in">
            <form id="loginForm" autocomplete="on">
                <h1>Iniciar Sesión</h1>
                <div class="social-icons">
                    <button type="button" class="icon google-btn" id="btnGoogle" aria-label="Continuar con Google">
                        <svg class="google-logo" viewBox="0 0 18 18" aria-hidden="true">
                            <path fill="#4285F4" d="M17.64 9.2045c0-.6381-.0573-1.2518-.1636-1.8409H9v3.4814h4.8436c-.2086 1.125-.8427 2.0782-1.7959 2.7164v2.2581h2.9087c1.7018-1.5668 2.6836-3.874 2.6836-6.615z"/>
                            <path fill="#34A853" d="M9 18c2.43 0 4.4673-.806 5.9564-2.1805l-2.9087-2.2581c-.806.54-1.8368.8595-3.0477.8595-2.344 0-4.3282-1.5831-5.036-3.7104H.9573v2.3318C2.4382 15.9831 5.4818 18 9 18z"/>
                            <path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.2823-1.1168-.2823-1.71s.1023-1.17.2823-1.71V4.9582H.9573C.3477 6.1732 0 7.5477 0 9s.3477 2.8268.9573 4.0418L3.964 10.71z"/>
                            <path fill="#EA4335" d="M9 3.5795c1.3214 0 2.5077.4541 3.4405 1.346l2.5813-2.5814C13.4632.8918 11.4259 0 9 0 5.4818 0 2.4382 2.0168.9573 4.9582L3.964 7.29C4.6718 5.1627 6.656 3.5795 9 3.5795z"/>
                        </svg>
                    </button>
                </div>
                <span>o usa tu email y contraseña</span>
                <input type="email" id="email" name="email" placeholder="Email" autocomplete="email" required>
                <input type="password" id="password" name="password" placeholder="Contraseña" autocomplete="current-password" required>
                <div class="remember-row">
                    <label class="remember-check">
                        <input type="checkbox" id="rememberMe" name="remember">
                        <span class="remember-label">Recordar contraseña</span>
                    </label>
                    <a href="../recuperar-password/recuperar-password.html" class="forgot-link">¿Olvidaste tu contraseña?</a>
                </div>
                <p class="error-msg" id="login-error"></p>
                <button type="submit" id="submitBtn">Iniciar Sesión</button>
            </form>
        </div>

        <!-- Panel decorativo animado -->
        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-panel toggle-left">
                    <h1>¡Bienvenido de nuevo!</h1>
                    <p>Introduce tus datos personales para usar todas las funciones del sitio</p>
                    <button class="hidden" id="login" type="button">Iniciar Sesión</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h1>¡Hola, bienvenido!</h1>
                    <p>Regístrate con tus datos personales y únete a nuestra comunidad</p>
                    <button class="hidden" id="register" type="button">Registrarse</button>
                </div>
            </div>
        </div>

    </div>

    <script type="module" src="login.js"></script>

</body>
</html>
