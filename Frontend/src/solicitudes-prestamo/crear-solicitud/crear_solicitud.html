<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UniGear — Procesando solicitud</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../compartido/estilos-base/tokens.css">
<link rel="stylesheet" href="crear_solicitud.css">
</head>
<body>

<div class="card" id="card">
  <!-- Estado: cargando -->
  <div class="icon-wrap loading" id="iconWrap">
    <svg class="spin" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" opacity=".2"/>
      <path d="M21 12a9 9 0 00-9-9"/>
    </svg>
  </div>
  <h1 id="title">Procesando tu solicitud…</h1>
  <p id="subtitle">Verificando el pago y registrando tu solicitud. Por favor, espera un momento.</p>

  <div class="detail-box" id="detailBox">
    <div class="detail-row"><span>Material</span><span id="dMaterial">—</span></div>
    <div class="detail-row"><span>Desde</span><span id="dDesde">—</span></div>
    <div class="detail-row"><span>Hasta</span><span id="dHasta">—</span></div>
    <div class="detail-row"><span>Fianza pagada</span><span>10,00 €</span></div>
  </div>

  <div class="actions" id="actions" style="display:none"></div>
</div>

<script type="module" src="crear_solicitud.js"></script>

</body>
</html>
