<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UniGear — Panel de Gestión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../compartido/estilos-base/tokens.css">
<link rel="stylesheet" href="panel_staff.css">
</head>
<body>

<div class="ripple-background" aria-hidden="true">
  <div class="circle xxlarge shade1"></div>
  <div class="circle xlarge shade2"></div>
  <div class="circle large shade3"></div>
  <div class="circle medium shade4"></div>
  <div class="circle small shade5"></div>
</div>

<main class="main">
  <div id="topbar-sentinel"></div>
  <div class="topbar" id="topbar">
    <div>
      <div class="breadcrumb">Páginas <span class="sep">/</span> Dashboard</div>
      <div class="page-title">Panel de Gestión</div>
    </div>
    <div class="topbar-right">
      <button class="tb-action" id="btnNuevaSancion">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        <span>Nueva sanción</span>
      </button>
      <a class="tb-action" href="../../usuarios/perfil/perfil_staff.html">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0114 0v1"/></svg>
        <span>Mi cuenta</span>
      </a>
    </div>
  </div>

  <!-- Stat cards -->
  <section class="stats stagger">
    <a class="card stat-card" href="../../solicitudes-prestamo/gestion-solicitudes/gestion_solicitudes.html?estado=pendiente">
      <div>
        <div class="stat-label">Solicitudes pendientes</div>
        <div class="stat-value"><span id="statPendientes">—</span></div>
      </div>
      <div class="stat-icon yellow">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
      </div>
    </a>
    <a class="card stat-card" href="../../prestamos/gestion-prestamos/gestion_prestamos.html">
      <div>
        <div class="stat-label">Préstamos activos</div>
        <div class="stat-value"><span id="statActivos">—</span></div>
      </div>
      <div class="stat-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10a4 4 0 014-4h8a4 4 0 014 4v10H4V10z"/><path d="M9 6V5a3 3 0 016 0v1"/><line x1="4" y1="15" x2="20" y2="15"/></svg>
      </div>
    </a>
    <a class="card stat-card" href="../../prestamos/gestion-prestamos/gestion_prestamos.html">
      <div>
        <div class="stat-label">Devoluciones hoy</div>
        <div class="stat-value"><span id="statDevoluciones">—</span></div>
      </div>
      <div class="stat-icon green">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.51"/></svg>
      </div>
    </a>
    <a class="card stat-card" href="../../solicitudes-prestamo/gestion-solicitudes/gestion_solicitudes.html?estado=en_espera">
      <div>
        <div class="stat-label">En lista de espera</div>
        <div class="stat-value"><span id="statEspera">—</span></div>
      </div>
      <div class="stat-icon slate">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      </div>
    </a>
  </section>

  <!-- Main grid -->
  <div class="main-grid">
    <!-- Tabla solicitudes recientes -->
    <div class="card table-card">
      <div class="table-head">
        <div class="table-title">Solicitudes recientes</div>
        <a class="table-link" href="../../solicitudes-prestamo/gestion-solicitudes/gestion_solicitudes.html">Ver todas <span class="arrow">→</span></a>
      </div>
      <div id="tablaSolicitudes">
        <div class="empty-state">Cargando...</div>
      </div>
    </div>

    <!-- Entregas pendientes -->
    <div class="card entregas-card">
      <div class="entregas-head">
        <div class="entregas-title">Entregas pendientes</div>
        <a class="table-link" href="../../prestamos/gestion-prestamos/gestion_prestamos.html">Gestionar <span class="arrow">→</span></a>
      </div>
      <div id="listaEntregas">
        <div class="empty-state">Cargando...</div>
      </div>
    </div>
  </div>
</main>

<!-- Modal nueva sanción -->
<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitleEl">
  <div class="modal">
    <div class="modal-title" id="modalTitleEl">Nueva sanción</div>
    <form id="formSancion" novalidate>
      <div class="field">
        <label for="sUsuario">Usuario *</label>
        <select id="sUsuario" required>
          <option value="">Cargando usuarios…</option>
        </select>
      </div>
      <div class="field">
        <label for="sTipo">Tipo *</label>
        <select id="sTipo" required>
          <option value="retraso">Retraso</option>
          <option value="danio">Daño en material</option>
          <option value="reposicion">Reposición</option>
          <option value="administrativa">Administrativa</option>
          <option value="otra">Otra</option>
        </select>
      </div>
      <div class="field">
        <label for="sMotivo">Motivo *</label>
        <textarea id="sMotivo" placeholder="Describe el motivo de la sanción…" required></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="sImporte">Importe (€) *</label>
          <input type="number" id="sImporte" min="0.01" step="0.01" placeholder="0.00" required />
        </div>
        <div class="field">
          <label for="sPrestamo">ID Préstamo (opcional)</label>
          <input type="number" id="sPrestamo" min="1" placeholder="—" />
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="sFechaInicio">Fecha inicio *</label>
          <input type="date" id="sFechaInicio" required />
        </div>
        <div class="field">
          <label for="sFechaFin">Fecha fin (opcional)</label>
          <input type="date" id="sFechaFin" />
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="btnCancelar">Cancelar</button>
        <button type="submit" class="btn-primary" id="btnGuardar">Crear sanción</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="panel_staff.js"></script>
</body>
</html>
