<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UniGear — Entregas y Devoluciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../compartido/estilos-base/tokens.css">
<link rel="stylesheet" href="gestion_prestamos.css">
</head>
<body>

<div class="ripple-background" aria-hidden="true">
  <div class="circle xxlarge shade1"></div>
  <div class="circle xlarge shade2"></div>
  <div class="circle large shade3"></div>
  <div class="circle medium shade4"></div>
  <div class="circle small shade5"></div>
</div>

<main class="main">
  <div id="topbar-sentinel"></div>
  <div class="topbar" id="topbar">
    <div>
      <div class="breadcrumb">Páginas <span class="sep">/</span> Entregas y Devoluciones</div>
      <div class="page-title">Entregas y Devoluciones</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" data-tab="entregas">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10a4 4 0 014-4h8a4 4 0 014 4v10H4V10z"/><path d="M9 6V5a3 3 0 016 0v1"/><line x1="4" y1="15" x2="20" y2="15"/></svg>
      Entregas
      <span class="tab-badge" id="badgeEntregas">—</span>
    </button>
    <button class="tab-btn" data-tab="devoluciones">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.51"/></svg>
      Devoluciones
      <span class="tab-badge" id="badgeDevoluciones">—</span>
    </button>
  </div>

  <!-- Tab entregas -->
  <div id="panelEntregas" class="tab-panel">
    <div class="table-card">
      <div id="tablaEntregas"><div class="empty-state">Cargando...</div></div>
    </div>
  </div>

  <!-- Tab devoluciones -->
  <div id="panelDevoluciones" class="tab-panel" hidden>
    <div class="table-card">
      <div id="tablaDevoluciones"><div class="empty-state">Cargando...</div></div>
    </div>
  </div>
</main>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle">—</h2>
      <button class="modal-close" id="modalClose" aria-label="Cerrar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="gestion_prestamos.js"></script>
</body>
</html>
