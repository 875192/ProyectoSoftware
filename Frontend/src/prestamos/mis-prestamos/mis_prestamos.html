<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UniGear — Mis Préstamos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../compartido/estilos-base/tokens.css">
<link rel="stylesheet" href="mis_prestamos.css">
</head>
<body>

<div class="ripple-background" aria-hidden="true">
  <div class="circle xxlarge shade1"></div>
  <div class="circle xlarge shade2"></div>
  <div class="circle large shade3"></div>
  <div class="circle medium shade4"></div>
  <div class="circle small shade5"></div>
</div>

<!-- Sidebar inyectado por compartido/componentes-ui/sidebar/sidebar.js -->

<main class="main">

  <!-- Topbar -->
  <div class="topbar">
    <div>
      <div class="breadcrumb">Páginas <span class="sep">/</span> Mis Préstamos</div>
      <div class="page-title">Mis préstamos</div>
    </div>
    <div class="topbar-right">
      <a class="tb-action" href="../../usuarios/perfil/perfil_usuario.html">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0114 0v1"/></svg>
        <span>Mi Perfil</span>
      </a>
      <a class="tb-icon" href="../../notificaciones/bandeja-notificaciones/notificaciones_usuario.html">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
        <span class="notif-dot"></span>
      </a>
    </div>
  </div>

  <!-- Resumen -->
  <section class="summary">
    <div class="card summary-left" id="heroCard">
      <div class="hero-eyebrow"><span class="dot"></span> Tu actividad</div>
      <h1 class="hero-title" id="heroTitle">Cargando…</h1>
      <p class="hero-desc" id="heroDesc">Aquí verás tus préstamos activos, retrasados y el historial de los anteriores.</p>
      <a class="hero-cta" href="../../catalogo/listado-materiales/listado_materiales.html">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Ver catálogo
      </a>
    </div>

    <div class="card summary-right">
      <div class="sr-header">
        <div class="sr-title">Resumen por estado</div>
        <div class="sr-sub" id="srSub">—</div>
      </div>
      <div class="sr-rows" id="srRows"></div>
    </div>
  </section>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="search-hero">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <label class="visually-hidden" for="searchInput" style="position:absolute; left:-9999px">Buscar préstamo</label>
      <input id="searchInput" type="text" placeholder="Busca por material o código (ej. PORT-014)…" autocomplete="off"/>
    </div>
    <select class="sort-select" id="sortSelect" aria-label="Ordenar préstamos">
      <option value="recent">Más recientes</option>
      <option value="deadline">Próximos a vencer</option>
      <option value="az">Material (A → Z)</option>
    </select>
  </div>

  <!-- Filtros -->
  <div class="chips" id="chips">
    <button class="chip active" data-filter="todos">Todos <span class="count" id="c-todos">0</span></button>
    <button class="chip" data-filter="activo">Activos <span class="count" id="c-activo">0</span></button>
    <button class="chip" data-filter="proximos_a_vencer">Próximos a vencer <span class="count" id="c-proximos_a_vencer">0</span></button>
    <button class="chip" data-filter="retrasado">Retrasados <span class="count" id="c-retrasado">0</span></button>
    <button class="chip" data-filter="finalizado">Finalizados <span class="count" id="c-finalizado">0</span></button>
    <button class="chip" data-filter="pendiente">Pendientes <span class="count" id="c-pendiente">0</span></button>
    <button class="chip" data-filter="cancelado">Cancelados <span class="count" id="c-cancelado">0</span></button>
  </div>

  <!-- List header -->
  <div class="list-header">
    <div>
      <div class="section-title">Lista de préstamos</div>
      <div class="section-sub"><span id="resultCount">0</span> resultados</div>
    </div>
  </div>

  <div class="list" id="list"></div>

</main>

<!-- Modal Reportar incidencia -->
<dialog class="modal" id="incidenciaModal" aria-labelledby="incTitle">
  <div class="modal-inner">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="incTitle">Reportar incidencia</div>
        <div class="modal-sub" id="incMaterial">—</div>
      </div>
      <button class="modal-close" type="button" aria-label="Cerrar" id="incClose">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <form id="incForm" method="dialog" novalidate>
      <div class="field">
        <label for="incTipo">Tipo de incidencia</label>
        <select id="incTipo" required>
          <option value="danio">Daño físico</option>
          <option value="averia">Avería técnica</option>
          <option value="mantenimiento">Necesita mantenimiento</option>
          <option value="otro">Otro</option>
        </select>
      </div>
      <div class="field">
        <label for="incDesc">Descripción</label>
        <textarea id="incDesc" required maxlength="500" placeholder="Cuéntanos qué ha pasado, cuándo, y si afecta al uso del material."></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="incCancel">Cancelar</button>
        <button type="submit" class="btn btn-primary">Enviar reporte</button>
      </div>
    </form>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="mis_prestamos.js"></script>

</body>
</html>
