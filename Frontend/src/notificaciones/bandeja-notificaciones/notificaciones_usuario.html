<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UniGear — Notificaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../compartido/estilos-base/tokens.css">
<style>
  /* Paleta y tokens en compartido/estilos-base/tokens.css. */
  :root {
    --teal-light:  var(--teal-100);
    --teal-mid:    var(--teal);
    --green:       var(--success-border);
    --green-dark:  var(--success-text);
    --green-light: var(--success-bg);
    --red:         var(--error-text);
    --red-light:   var(--error-bg);
    --yellow-light: var(--yellow-50);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    font-family: var(--font-body);
    background: var(--off-white);
    color: var(--text);
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, .brand-name, .page-title, .section-title, .notif-title, .empty-title {
    font-family: 'Bricolage Grotesque', sans-serif;
  }

  a { text-decoration: none; color: inherit; }

  /* Sidebar y help-card viven en compartido/componentes-ui/sidebar/. */

  /* ===== MAIN ===== */
  .main {
    margin-left: var(--sidebar-w);
    padding: 22px 30px 40px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }
  .breadcrumb { font-size: 12px; color: var(--text-muted); }
  .breadcrumb .sep { margin: 0 4px; }
  .page-title { font-size: 15px; font-weight: 700; color: var(--navy); margin-top: 2px; }

  .topbar-right { display: flex; align-items: center; gap: 16px; }
  .tb-action {
    display: flex; align-items: center; gap: 6px;
    color: var(--text-light);
    font-size: 12px; font-weight: 600;
    cursor: pointer;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    transition: background 0.18s;
  }
  .tb-action:hover { background: var(--teal-light); color: var(--teal-dark); }

  /* ===== HEADER INTERNO ===== */
  .head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    gap: 12px;
    flex-wrap: wrap;
  }
  .head-left .section-title {
    font-size: 22px;
    font-weight: 700;
    color: var(--navy);
    letter-spacing: -0.4px;
  }
  .head-left .section-sub {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .head-left .section-sub b { color: var(--teal-dark); font-weight: 700; }

  .link-btn {
    background: transparent;
    border: none;
    color: var(--teal-dark);
    font-weight: 700;
    font-size: 12px;
    cursor: pointer;
    padding: 8px 10px;
    border-radius: 8px;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.18s;
  }
  .link-btn:hover { background: var(--teal-light); }

  /* ===== TABS ===== */
  .tabs {
    display: flex;
    gap: 4px;
    padding: 4px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 18px;
    width: fit-content;
  }
  .tab {
    background: transparent;
    border: none;
    padding: 8px 14px;
    border-radius: 9px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-light);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.18s, color 0.18s;
  }
  .tab:hover { color: var(--teal-dark); }
  .tab.active {
    background: var(--teal);
    color: #fff;
  }
  .tab .count {
    font-size: 10.5px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 10px;
    background: var(--bg);
    color: var(--text-muted);
  }
  .tab.active .count {
    background: rgba(255,255,255,0.25);
    color: #fff;
  }

  /* ===== LISTA ===== */
  .list {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow-lg);
  }

  .notif {
    display: grid;
    grid-template-columns: 40px 1fr auto;
    gap: 14px;
    align-items: flex-start;
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
  }
  .notif:last-child { border-bottom: none; }
  .notif:hover { background: #fafafa; }

  .notif.unread { background: rgba(15,118,110,0.035); }
  .notif.unread:hover { background: rgba(15,118,110,0.06); }
  .notif.unread::before {
    content: '';
    position: absolute;
    top: 22px; left: 6px;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--teal);
  }

  .notif-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    display: grid; place-items: center;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .notif.t-solicitud  .notif-icon { background: var(--teal-light);   color: var(--teal-dark); }
  .notif.t-prestamo   .notif-icon { background: var(--green-light);  color: var(--green-dark); }
  .notif.t-devolucion .notif-icon { background: #dbeafe;             color: #1d4ed8; }
  .notif.t-sancion    .notif-icon { background: var(--red-light);    color: var(--red); }
  .notif.t-sistema    .notif-icon { background: var(--yellow-light); color: #854d0e; }

  .notif-body { min-width: 0; }
  .notif-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--navy);
    letter-spacing: -0.1px;
    margin-bottom: 3px;
    line-height: 1.35;
  }
  .notif.unread .notif-title { font-weight: 700; }
  .notif-text {
    font-size: 13px;
    color: var(--text-light);
    line-height: 1.5;
  }
  .notif-text b { color: var(--navy); font-weight: 600; }

  .notif-side {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 8px;
    flex-shrink: 0;
  }
  .notif-time {
    font-size: 11.5px;
    color: var(--text-muted);
    font-weight: 500;
    white-space: nowrap;
  }
  .icon-btn {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: transparent;
    color: var(--text-muted);
    border: none;
    cursor: pointer;
    display: grid; place-items: center;
    transition: background 0.18s, color 0.18s;
    opacity: 0;
  }
  .notif:hover .icon-btn { opacity: 1; }
  .icon-btn:hover { background: var(--red-light); color: var(--red); }

  /* ===== EMPTY ===== */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-muted);
    font-size: 13px;
  }
  .empty .empty-icon {
    width: 56px; height: 56px;
    border-radius: 14px;
    background: var(--teal-light);
    color: var(--teal);
    display: grid; place-items: center;
    margin: 0 auto 14px;
  }
  .empty-title { font-size: 16px; font-weight: 700; color: var(--navy); margin-bottom: 6px; }
  .empty-desc { max-width: 340px; margin: 0 auto; line-height: 1.55; }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 768px) {
    .main { margin-left: 0; padding: 16px; }
    .topbar-right .tb-action span { display: none; }
    .tabs { width: 100%; overflow-x: auto; }
    .notif-side { flex-direction: row-reverse; align-items: center; }
    .icon-btn { opacity: 1; }
  }
</style>
</head>
<body>

<!-- Sidebar inyectado por compartido/componentes-ui/sidebar/sidebar.js -->

<!-- ===== MAIN ===== -->
<main class="main">

  <!-- Topbar -->
  <div class="topbar">
    <div>
      <div class="breadcrumb">Páginas <span class="sep">/</span> Notificaciones</div>
      <div class="page-title">Notificaciones</div>
    </div>
    <div class="topbar-right">
      <a class="tb-action" href="../../usuarios/perfil/perfil_usuario.html">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0114 0v1"/></svg>
        <span>Mi cuenta</span>
      </a>
    </div>
  </div>

  <!-- Head -->
  <div class="head">
    <div class="head-left">
      <div class="section-title">Tus notificaciones</div>
      <div class="section-sub">Tienes <b id="unreadCount">0</b> sin leer</div>
    </div>
    <button class="link-btn" id="markAllReadBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      Marcar todo como leído
    </button>
  </div>

  <!-- Tabs -->
  <div class="tabs" id="tabs">
    <button class="tab active" data-filter="todas">Todas <span class="count" id="c-todas">0</span></button>
    <button class="tab" data-filter="no_leidas">Sin leer <span class="count" id="c-no_leidas">0</span></button>
  </div>

  <!-- Lista -->
  <div class="list" id="list"></div>

</main>

<script type="module">
  import { auth } from '../../compartido/nucleo/auth.js';
  import { api } from '../../compartido/nucleo/api.js';
  import { mountSidebar } from '../../compartido/componentes-ui/sidebar/sidebar.js';
  const currentUser = auth.requireAuth(['estudiante', 'profesor']);
  mountSidebar({ activePage: 'notificaciones', basePath: '../..' });

  window.__api = api;
  window.__currentUser = currentUser;
</script>

<script>
  // Las notificaciones se cargan async desde el backend
  let notifications = [];
  let anchor = new Date();

  (async function init() {
    const currentUser = window.__currentUser;
    const api = window.__api;

    if (currentUser && api) {
      try {
        const data = await api.getNotificaciones(currentUser.id);
        anchor = new Date();
        notifications = data.map(n => ({
          id: n.id,
          tipo: n.category || 'sistema',
          titulo: n.title,
          texto: n.message,
          fecha: n.createdAt ? new Date(n.createdAt) : new Date(),
          leida: !!n.read
        }));
      } catch (err) {
        console.error('Error cargando notificaciones:', err);
        notifications = [];
      }
    }
    render();
  })();

  // ===== DATOS =====
  const typeIcons = {
    solicitud:  '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>',
    prestamo:   '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10a4 4 0 014-4h8a4 4 0 014 4v10H4V10z"/><path d="M9 6V5a3 3 0 016 0v1"/><line x1="4" y1="15" x2="20" y2="15"/></svg>',
    devolucion: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9"/><polyline points="3 4 3 12 11 12"/></svg>',
    sancion:    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.86l-8.22 14.2A2 2 0 003.8 21h16.4a2 2 0 001.72-2.94l-8.22-14.2a2 2 0 00-3.4 0z"/></svg>',
    sistema:    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'
  };

  let activeFilter = 'todas';

  function formatRelative(fecha) {
    const diffMs = anchor - fecha;
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return 'ahora';
    if (mins < 60) return `hace ${mins} min`;
    const hs = Math.floor(mins / 60);
    if (hs < 24) return `hace ${hs} h`;
    const ds = Math.floor(hs / 24);
    if (ds === 1) return 'ayer';
    if (ds < 7) return `hace ${ds} d`;
    return fecha.toLocaleDateString('es-ES', { day: '2-digit', month: 'short' });
  }

  function updateCounts() {
    const unread = notifications.filter(n => !n.leida).length;
    document.getElementById('unreadCount').textContent = unread;
    document.getElementById('c-todas').textContent = notifications.length;
    document.getElementById('c-no_leidas').textContent = unread;
    const side = document.getElementById('sideUnread');
    if (side) {
      if (unread > 0) { side.textContent = unread; side.style.display = ''; }
      else { side.style.display = 'none'; }
    }
  }

  function renderList() {
    const items = notifications
      .filter(n => activeFilter === 'todas' || !n.leida)
      .sort((a, b) => b.fecha - a.fecha);

    const host = document.getElementById('list');

    if (items.length === 0) {
      host.innerHTML = `
        <div class="empty">
          <div class="empty-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/>
            </svg>
          </div>
          <div class="empty-title">Todo al día</div>
          <div class="empty-desc">No tienes notificaciones ${activeFilter === 'no_leidas' ? 'sin leer' : ''}.</div>
        </div>`;
      return;
    }

    host.innerHTML = items.map(n => `
      <article class="notif t-${n.tipo} ${n.leida ? '' : 'unread'}" data-id="${n.id}">
        <div class="notif-icon">${typeIcons[n.tipo]}</div>
        <div class="notif-body">
          <div class="notif-title">${n.titulo}</div>
          <div class="notif-text">${n.texto}</div>
        </div>
        <div class="notif-side">
          <span class="notif-time">${formatRelative(n.fecha)}</span>
          <button class="icon-btn" data-action="delete" data-id="${n.id}" title="Eliminar">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
          </button>
        </div>
      </article>
    `).join('');

    host.querySelectorAll('.notif').forEach(el => {
      el.addEventListener('click', (e) => {
        if (e.target.closest('button')) return;
        const id = el.dataset.id;
        const n = notifications.find(x => x.id === id);
        if (n && !n.leida) { n.leida = true; render(); }
      });
    });
    host.querySelectorAll('[data-action="delete"]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = btn.dataset.id;
        const i = notifications.findIndex(x => x.id === id);
        if (i !== -1) notifications.splice(i, 1);
        render();
      });
    });
  }

  function render() {
    updateCounts();
    renderList();
  }

  document.querySelectorAll('#tabs .tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('#tabs .tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      activeFilter = tab.dataset.filter;
      renderList();
    });
  });

  document.getElementById('markAllReadBtn').addEventListener('click', () => {
    notifications.forEach(n => n.leida = true);
    render();
  });

  render();
</script>

</body>
</html>
