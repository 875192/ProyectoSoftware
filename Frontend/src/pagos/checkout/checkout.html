<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UniGear — Pagar sanción</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../compartido/estilos-base/tokens.css">
<link rel="stylesheet" href="checkout.css">
</head>
<body>

<div class="ripple-background" aria-hidden="true">
  <div class="circle xxlarge shade1"></div>
  <div class="circle xlarge shade2"></div>
  <div class="circle large shade3"></div>
  <div class="circle medium shade4"></div>
  <div class="circle small shade5"></div>
</div>

<main class="main">
  <div class="topbar">
    <div>
      <div class="breadcrumb">
        <a href="../../sanciones/mis-sanciones/mis_sanciones.html">Sanciones</a>
        <span class="sep">/</span>
        Pagar
      </div>
      <div class="page-title">Pagar sanción</div>
    </div>
  </div>

  <div class="layout">
    <!-- Resumen -->
    <section class="card">
      <div class="summary-eyebrow">Resumen</div>
      <div class="summary-title" id="summaryTitle">Cargando…</div>

      <dl class="summary-detail">
        <dt>Sanción</dt>
        <dd id="summaryId">—</dd>
        <dt>Material</dt>
        <dd id="summaryMaterial">—</dd>
        <dt>Préstamo</dt>
        <dd id="summaryPrestamo">—</dd>
        <dt>Fecha</dt>
        <dd id="summaryDate">—</dd>
      </dl>

      <div class="summary-amount-row">
        <div class="summary-amount-label">Total a pagar</div>
        <div class="summary-amount" id="summaryAmount">0,00 €</div>
      </div>

      <div class="summary-note">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <div>El pago se procesa de forma segura mediante Stripe. Recibirás el recibo por correo en cuanto se confirme la transacción.</div>
      </div>
    </section>

    <!-- Pago -->
    <section class="card">
      <div class="pay-title">Datos de pago</div>
      <div class="pay-sub">
        <span class="stripe-badge">Procesado por Stripe</span>
      </div>

      <div id="payContent">
        <div style="text-align:center;padding:32px 0;color:var(--text-muted);font-size:13px;">Cargando…</div>
      </div>
    </section>
  </div>
</main>

<script type="module" src="checkout.js"></script>

</body>
</html>
