<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UniGear — Historial de pagos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../compartido/estilos-base/tokens.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: var(--font-body);
    background: var(--off-white);
    color: var(--text);
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4, .page-title, .summary-value, .empty-title { font-family: var(--font-display); }
  a { text-decoration: none; color: inherit; }
  button, select { font-family: inherit; cursor: pointer; }

  .main { margin-left: var(--sidebar-w); padding: 22px 30px 60px; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 22px; flex-wrap: wrap; gap: 12px;
  }
  .breadcrumb { font-size: 12px; color: var(--text-muted); }
  .breadcrumb .sep { margin: 0 6px; }
  .page-title { font-size: 20px; font-weight: 700; color: var(--navy); margin-top: 4px; letter-spacing: -0.3px; }

  .toast {
    display: flex; align-items: center; gap: 10px;
    background: var(--success-bg);
    color: var(--success-text);
    border: 1px solid var(--success-border);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 13.5px; font-weight: 600;
    margin-bottom: 18px;
    animation: slide-in 380ms cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes slide-in {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card {
    background: var(--card);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-lg);
    padding: 22px;
  }

  .summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin-bottom: 22px;
  }
  .summary-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: box-shadow 220ms cubic-bezier(0.25, 1, 0.5, 1);
  }
  .summary-card:hover { box-shadow: var(--shadow-xl); }
  .summary-label {
    font-size: 11px; font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.4px;
    margin-bottom: 6px;
  }
  .summary-value {
    font-size: 22px; font-weight: 700;
    color: var(--navy); letter-spacing: -0.3px;
    font-variant-numeric: tabular-nums;
  }
  .summary-icon {
    width: 46px; height: 46px;
    border-radius: 12px;
    background: var(--teal-50); color: var(--teal);
    display: grid; place-items: center;
  }

  /* Filtros */
  .toolbar {
    display: flex; flex-wrap: wrap;
    align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 14px;
  }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    font-size: 12.5px; font-weight: 600;
    color: var(--text-light);
    background: var(--card);
    border: 1px solid var(--border);
    padding: 7px 14px;
    border-radius: 999px;
    transition: all 180ms cubic-bezier(0.25, 1, 0.5, 1);
  }
  .chip:hover { border-color: var(--teal-100); color: var(--teal-dark); }
  .chip.active { background: var(--teal); color: #fff; border-color: var(--teal); }

  .year-select {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 12px 7px 14px;
    font-size: 12.5px; font-weight: 600;
    color: var(--text-light);
    transition: border-color 180ms cubic-bezier(0.25, 1, 0.5, 1);
  }
  .year-select:hover { border-color: var(--teal-100); }
  .year-select:focus { outline: 2px solid var(--teal); outline-offset: 2px; }

  /* Tabla */
  .table-card { padding: 0; overflow: hidden; }
  .table-wrap { overflow-x: auto; }
  table.payments {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }
  table.payments thead th {
    text-align: left;
    font-size: 11px; font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.4px;
    padding: 14px 22px;
    background: var(--gray-50);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  table.payments tbody td {
    padding: 16px 22px;
    border-bottom: 1px solid var(--border-soft);
    color: var(--text);
    vertical-align: middle;
  }
  table.payments tbody tr {
    transition: background 160ms cubic-bezier(0.25, 1, 0.5, 1);
  }
  table.payments tbody tr:hover { background: var(--gray-50); }
  table.payments tbody tr:last-child td { border-bottom: none; }

  .p-date { color: var(--gray-700); font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .p-concept-main { color: var(--navy); font-weight: 600; }
  .p-concept-sub { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
  .p-amount {
    font-family: var(--font-display);
    font-weight: 700; font-size: 14px;
    color: var(--gray-900);
    text-align: right;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .p-method {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--gray-600);
    font-size: 12.5px;
  }
  .p-method svg { color: var(--teal); }
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    text-transform: uppercase; letter-spacing: 0.3px;
    white-space: nowrap;
  }
  .badge.paid     { background: var(--success-bg); color: var(--success-text); }
  .badge.refunded { background: var(--gray-100); color: var(--gray-600); }
  .badge.failed   { background: var(--error-bg); color: var(--error-text); }

  .receipt-link {
    color: var(--teal-dark);
    font-weight: 600; font-size: 12.5px;
    display: inline-flex; align-items: center; gap: 5px;
    transition: color 180ms cubic-bezier(0.25, 1, 0.5, 1);
  }
  .receipt-link:hover { color: var(--teal); }

  /* Empty */
  .empty {
    text-align: center;
    padding: 60px 22px;
  }
  .empty-icon {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: var(--teal-50);
    color: var(--teal);
    display: grid; place-items: center;
    margin: 0 auto 18px;
  }
  .empty-title {
    font-size: 19px; font-weight: 700;
    color: var(--navy); margin-bottom: 6px;
  }
  .empty-desc {
    font-size: 13.5px; color: var(--text-muted);
    max-width: 380px; margin: 0 auto; line-height: 1.6;
  }

  @media (max-width: 1100px) {
    .summary { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 768px) {
    .main { margin-left: 0; padding: 16px; }
    .summary { grid-template-columns: 1fr; }
    table.payments thead { display: none; }
    table.payments tbody td {
      display: block;
      padding: 6px 16px;
      border-bottom: none;
    }
    table.payments tbody tr {
      display: block;
      padding: 14px 0;
      border-bottom: 1px solid var(--border-soft);
    }
    .p-amount { text-align: left; }
  }
</style>
</head>
<body>

<main class="main">
  <div class="topbar">
    <div>
      <div class="breadcrumb">Páginas <span class="sep">/</span> Pagos <span class="sep">/</span> Historial</div>
      <div class="page-title">Historial de pagos</div>
    </div>
  </div>

  <div id="successToast" class="toast" hidden>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
    Pago realizado correctamente. Recibirás el recibo por correo.
  </div>

  <!-- Resumen -->
  <section class="summary">
    <div class="card summary-card">
      <div>
        <div class="summary-label">Total pagado</div>
        <div class="summary-value" id="totalPaid">0,00 €</div>
      </div>
      <div class="summary-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
      </div>
    </div>
    <div class="card summary-card">
      <div>
        <div class="summary-label">Pagos realizados</div>
        <div class="summary-value" id="paymentCount">0</div>
      </div>
      <div class="summary-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
      </div>
    </div>
    <div class="card summary-card">
      <div>
        <div class="summary-label">Último pago</div>
        <div class="summary-value" id="lastPayment">—</div>
      </div>
      <div class="summary-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      </div>
    </div>
  </section>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="filters" role="tablist" aria-label="Filtrar por estado">
      <button class="chip active" data-filter="all" role="tab" aria-selected="true">Todos</button>
      <button class="chip" data-filter="paid" role="tab" aria-selected="false">Pagados</button>
      <button class="chip" data-filter="refunded" role="tab" aria-selected="false">Reembolsados</button>
      <button class="chip" data-filter="failed" role="tab" aria-selected="false">Fallidos</button>
    </div>
    <select class="year-select" id="yearFilter" aria-label="Filtrar por año">
      <option value="all">Todos los años</option>
      <option value="2026">2026</option>
      <option value="2025">2025</option>
    </select>
  </div>

  <!-- Tabla -->
  <section class="card table-card">
    <div class="table-wrap">
      <table class="payments" id="paymentsTable">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Concepto</th>
            <th>Método</th>
            <th style="text-align:right">Importe</th>
            <th>Estado</th>
            <th>Recibo</th>
          </tr>
        </thead>
        <tbody id="paymentsBody"></tbody>
      </table>
    </div>
  </section>
</main>

<script type="module">
  import { auth } from '../../compartido/nucleo/auth.js';
  import { api } from '../../compartido/nucleo/api.js';
  import { mountSidebar } from '../../compartido/componentes-ui/sidebar/sidebar.js';

  const user = auth.requireAuth(['estudiante', 'profesor']);
  mountSidebar({ activePage: 'pagos', basePath: '../..' });
  if (user) init(user);

  async function init(user) {
    const params = new URLSearchParams(window.location.search);
    if (params.get('status') === 'success') {
      document.getElementById('successToast').hidden = false;
    }

    const fmtMoney = (n, sign = '') =>
      sign + n.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
    const fmtDate = (iso) =>
      new Date(iso).toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });

    const body = document.getElementById('paymentsBody');

    const renderEmpty = (msg = 'No hay pagos en este filtro', desc = 'Cambia los filtros o vuelve más tarde. Tus próximos pagos aparecerán aquí.') => {
      body.innerHTML = `
        <tr><td colspan="6">
          <div class="empty">
            <div class="empty-icon">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
            </div>
            <div class="empty-title">${msg}</div>
            <div class="empty-desc">${desc}</div>
          </div>
        </td></tr>`;
    };

    let pagos = [];
    try {
      const data = await api.getPagos(user.id);
      pagos = data.map(p => ({
        id: p.id,
        fecha: p.fecha,
        concepto: p.concepto,
        conceptoSub: p.conceptoSub,
        metodo: p.metodo,
        importe: p.importe,
        estado: p.estado === 'reembolsado' ? 'refunded'
              : p.estado === 'fallido'     ? 'failed'
              : p.estado === 'pagado'      ? 'paid'
              : p.estado,
        recibo: p.reciboUrl || '#',
      }));
    } catch (err) {
      console.error('Error al cargar pagos:', err);
      renderEmpty('No se pudieron cargar los pagos', err.message);
      return;
    }

    const totalsPaid = pagos.filter(p => p.estado === 'paid').reduce((acc, p) => acc + p.importe, 0);
    document.getElementById('totalPaid').textContent = fmtMoney(totalsPaid);
    document.getElementById('paymentCount').textContent = pagos.filter(p => p.estado === 'paid').length;
    const ultimo = pagos.filter(p => p.estado === 'paid')[0];
    document.getElementById('lastPayment').textContent = ultimo ? fmtDate(ultimo.fecha) : '—';

    // Poblamos el selector de años con los disponibles
    const yearSelect = document.getElementById('yearFilter');
    const years = Array.from(new Set(pagos.map(p => new Date(p.fecha).getFullYear()))).sort((a, b) => b - a);
    yearSelect.innerHTML = '<option value="all">Todos los años</option>' +
      years.map(y => `<option value="${y}">${y}</option>`).join('');

    const renderRow = (p) => {
      const badgeMap = { paid: 'Pagado', refunded: 'Reembolsado', failed: 'Fallido', pendiente: 'Pendiente' };
      const sign = p.estado === 'refunded' ? '−' : '';
      const reciboHref = p.recibo && p.recibo !== '#' ? p.recibo : '#';
      return `
        <tr>
          <td class="p-date">${fmtDate(p.fecha)}</td>
          <td>
            <div class="p-concept-main">${p.concepto}</div>
            ${p.conceptoSub ? `<div class="p-concept-sub">${p.conceptoSub}</div>` : ''}
          </td>
          <td>
            <span class="p-method">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
              ${p.metodo || '—'}
            </span>
          </td>
          <td class="p-amount">${fmtMoney(p.importe, sign)}</td>
          <td><span class="badge ${p.estado}">${badgeMap[p.estado] || p.estado}</span></td>
          <td>
            <a class="receipt-link" href="${reciboHref}" aria-label="Descargar recibo del pago ${p.id}">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              Recibo
            </a>
          </td>
        </tr>`;
    };

    let filterEstado = 'all';
    let filterYear = 'all';

    const render = () => {
      let items = pagos;
      if (filterEstado !== 'all') items = items.filter(p => p.estado === filterEstado);
      if (filterYear !== 'all') items = items.filter(p => String(new Date(p.fecha).getFullYear()) === filterYear);
      if (items.length === 0) { renderEmpty(); return; }
      body.innerHTML = items.map(renderRow).join('');
    };

    render();

    document.querySelectorAll('.chip[data-filter]').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.chip[data-filter]').forEach(c => {
          c.classList.remove('active');
          c.setAttribute('aria-selected', 'false');
        });
        chip.classList.add('active');
        chip.setAttribute('aria-selected', 'true');
        filterEstado = chip.dataset.filter;
        render();
      });
    });

    yearSelect.addEventListener('change', (e) => {
      filterYear = e.target.value;
      render();
    });
  }
</script>

</body>
</html>
