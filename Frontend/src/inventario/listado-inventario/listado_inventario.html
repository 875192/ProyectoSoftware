<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UniGear — Inventario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../compartido/estilos-base/tokens.css">
<link rel="stylesheet" href="listado_inventario.css">
</head>
<body>

<div class="ripple-background" aria-hidden="true">
  <div class="circle xxlarge shade1"></div>
  <div class="circle xlarge shade2"></div>
  <div class="circle large shade3"></div>
  <div class="circle medium shade4"></div>
  <div class="circle small shade5"></div>
</div>

<main class="main">
  <div id="topbar-sentinel"></div>
  <div class="topbar" id="topbar">
    <div>
      <div class="breadcrumb">Páginas <span class="sep">/</span> Inventario</div>
      <div class="page-title">Inventario de Materiales</div>
    </div>
    <div class="topbar-right">
      <label class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search" type="text" placeholder="Buscar material..." />
      </label>
      <select id="filtroCategoria" class="filter-select" aria-label="Filtrar por categoría">
        <option value="">Todas las categorías</option>
      </select>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats" id="statsRow">
    <div class="stat-chip">
      <div class="stat-chip-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg></div>
      <div><div class="stat-chip-label">Modelos activos</div><div class="stat-chip-value" id="statModelos">—</div></div>
    </div>
    <div class="stat-chip">
      <div class="stat-chip-icon green"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>
      <div><div class="stat-chip-label">Unidades disponibles</div><div class="stat-chip-value" id="statDisponibles">—</div></div>
    </div>
    <div class="stat-chip">
      <div class="stat-chip-icon red"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg></div>
      <div><div class="stat-chip-label">No operativas</div><div class="stat-chip-value" id="statNoOp">—</div></div>
    </div>
  </div>

  <!-- Lista inventario -->
  <div class="inventario-list" id="inventarioList">
    <div class="empty-state">Cargando inventario...</div>
  </div>
</main>

<script type="module" src="listado_inventario.js"></script>
</body>
</html>
