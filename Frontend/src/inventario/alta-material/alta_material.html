<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniGear — Alta de Material</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../compartido/estilos-base/tokens.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { font-family: var(--font-body); background: var(--off-white); color: var(--text); -webkit-font-smoothing: antialiased; }
    h1, h2, h3, .page-title { font-family: var(--font-display); }

    .main { margin-left: var(--sidebar-w); padding: 28px 32px; display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 40px); }

    .card {
      width: 100%;
      max-width: 820px;
      background: var(--card);
      border-radius: 14px;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
      padding: 26px;
    }

    .card-header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom: 12px; }
    .page-title { font-size: 20px; font-weight: 800; color: var(--navy); }
    .card-sub { color: var(--text-muted); font-size: 13px; }

    form { margin-top: 14px; display: grid; gap: 14px; }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .full { grid-column: 1 / -1; }

    label { font-size: 13px; color: var(--text-muted); font-weight: 700; display: block; margin-bottom: 6px; }
    .field { display:block; }
    .field-error { color: var(--error-text); font-size: 12px; margin-top: 6px; display: none; }
    input[type="text"], select, textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--white);
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: box-shadow 0.15s, border-color 0.12s;
    }
    input[type="text"]:focus, select:focus, textarea:focus { border-color: var(--teal); box-shadow: 0 0 0 4px rgba(15,118,110,0.06); }
    .input-error { border-color: var(--error-text) !important; box-shadow: 0 0 0 4px rgba(185,28,28,0.05); }

    textarea { min-height: 120px; resize: vertical; }

    .actions { display:flex; gap: 12px; justify-content: flex-end; margin-top: 6px; }
    .btn { padding: 10px 16px; border-radius: 10px; font-weight: 700; cursor: pointer; border: none; font-size: 14px; }
    .btn-save { background: var(--teal); color: var(--white); box-shadow: 0 8px 18px -6px rgba(15,118,110,0.38); }
    .btn-save:hover { background: var(--teal-dark); }
    .btn-cancel { background: var(--gray-100); color: var(--text); border: 1px solid var(--border); }

    @media (max-width: 900px) {
      .row { grid-template-columns: 1fr; }
      .main { padding: 18px; min-height: auto; }
    }
  </style>
</head>
<body>

<main class="main">
  <section class="card" role="region" aria-labelledby="title-alta">
    <div class="card-header">
      <div>
        <h1 id="title-alta" class="page-title">Alta de nuevo equipo</h1>
        <div class="card-sub">Rellena los datos básicos y guarda el equipo en el inventario.</div>
      </div>
      <div aria-hidden="true">
        <!-- placeholder for small helper actions -->
      </div>
    </div>

    <form id="altaForm" onsubmit="return false;">
      <div class="row">
        <div class="field">
          <label for="nombre">Nombre del equipo</label>
          <input id="nombre" name="nombre" type="text" placeholder="Ej: Portátil Dell XPS 13" required />
          <div id="err-nombre" class="field-error">El nombre del equipo es obligatorio.</div>
        </div>

        <div class="field">
          <label for="marca">Marca / Modelo</label>
          <input id="marca" name="marca" type="text" placeholder="Ej: Dell / XPS 13" required />
          <div id="err-marca" class="field-error">La marca/modelo es obligatoria.</div>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label for="serie">Número de Serie</label>
          <input id="serie" name="serie" type="text" placeholder="Ej: SN123456789" required />
          <div id="err-serie" class="field-error">El número de serie es obligatorio.</div>
        </div>

        <div class="field">
          <label for="categoria">Categoría</label>
          <select id="categoria" name="categoria" required>
            <option value="">-- Selecciona categoría --</option>
            <option value="informatica">Informática</option>
            <option value="audio">Audio</option>
            <option value="video">Vídeo</option>
            <option value="herramientas">Herramientas</option>
            <option value="deporte">Deporte</option>
          </select>
          <div id="err-categoria" class="field-error">Selecciona una categoría.</div>
        </div>
      </div>

      <div class="full">
        <label for="observaciones">Observaciones iniciales</label>
        <textarea id="observaciones" name="observaciones" placeholder="Ej: Incluye funda; batería en buen estado"></textarea>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-cancel" id="btnCancel">Cancelar</button>
        <button type="button" class="btn btn-save" id="btnSave">Guardar Equipo</button>
      </div>
    </form>
  </section>
</main>

<script type="module">
  import { auth } from '../../compartido/nucleo/auth.js';
  import { mountSidebar } from '../../compartido/componentes-ui/sidebar/sidebar.js';
  auth.requireAuth(['personal_gestion']);
  mountSidebar({ activePage: 'inventario', basePath: '../..' });
</script>

<script>
  const btnCancel = document.getElementById('btnCancel');
  const btnSave = document.getElementById('btnSave');
  const altaForm = document.getElementById('altaForm');
  const LS_KEY = 'unigear_inventory';

  function getPersisted() { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); }
  function savePersisted(arr) { localStorage.setItem(LS_KEY, JSON.stringify(arr)); }

  // Toast
  function showToast(msg, type='info') {
    const t = document.createElement('div');
    t.textContent = msg;
    t.style.position = 'fixed'; t.style.right = '18px'; t.style.top = '18px';
    t.style.padding = '10px 14px'; t.style.borderRadius = '10px'; t.style.zIndex = 120; t.style.color = '#fff';
    t.style.fontWeight = '700'; t.style.fontSize = '13px';
    if (type === 'success') t.style.background = 'linear-gradient(90deg, #10b981, #059669)';
    else if (type === 'error') t.style.background = 'linear-gradient(90deg, #ef4444, #dc2626)';
    else t.style.background = 'rgba(17,24,39,0.9)';
    document.body.appendChild(t);
    setTimeout(() => { t.style.transition = 'opacity 300ms'; t.style.opacity = '0'; }, 1600);
    setTimeout(() => t.remove(), 2000);
  }

  btnCancel.addEventListener('click', () => {
    window.location.href = '../listado-inventario/listado_inventario.html';
  });

  function clearErrors() {
    ['nombre','marca','serie','categoria'].forEach(id => {
      const err = document.getElementById('err-' + id);
      const inp = document.getElementById(id);
      if (err) err.style.display = 'none';
      if (inp) inp.classList.remove('input-error');
      if (inp) inp.removeAttribute('aria-invalid');
    });
  }

  function validateForm() {
    clearErrors();
    let ok = true;
    const fields = [
      { id: 'nombre', msg: 'El nombre del equipo es obligatorio.' },
      { id: 'marca',  msg: 'La marca/modelo es obligatoria.' },
      { id: 'serie',  msg: 'El número de serie es obligatorio.' },
      { id: 'categoria', msg: 'Selecciona una categoría.' }
    ];
    for (const f of fields) {
      const el = document.getElementById(f.id);
      const val = el ? el.value.trim() : '';
      if (!val) {
        const err = document.getElementById('err-' + f.id);
        if (err) err.textContent = f.msg, err.style.display = 'block';
        if (el) el.classList.add('input-error'), el.setAttribute('aria-invalid', 'true');
        if (ok && el) el.focus();
        ok = false;
      }
    }
    return ok;
  }

  // Check for edit mode via query param ?edit=ID
  const params = new URLSearchParams(window.location.search);
  const editId = params.get('edit');
  if (editId) {
    // load persisted and prefill
    const persisted = getPersisted();
    const item = persisted.find(p => p.id === editId);
    if (item) {
      document.getElementById('nombre').value = item.nombre || '';
      document.getElementById('marca').value = item.marca || '';
      document.getElementById('serie').value = item.serie || '';
      document.getElementById('categoria').value = item.categoria || '';
      document.getElementById('observaciones').value = item.observaciones || '';
      document.getElementById('title-alta').textContent = 'Editar equipo';
      btnSave.textContent = 'Guardar cambios';
    } else {
      // If not found, redirect back
      showToast('Elemento para editar no encontrado.', 'error');
      setTimeout(() => window.location.href = '../listado-inventario/listado_inventario.html', 900);
    }
  }

  btnSave.addEventListener('click', () => {
    if (!validateForm()) return;

    const nombre = document.getElementById('nombre').value.trim();
    const marca = document.getElementById('marca').value.trim();
    const serie = document.getElementById('serie').value.trim();
    const categoria = document.getElementById('categoria').value;
    const observaciones = document.getElementById('observaciones').value.trim();

    const stored = getPersisted();
    if (editId) {
      const idx = stored.findIndex(s => s.id === editId);
      if (idx >= 0) {
        stored[idx] = Object.assign({}, stored[idx], { nombre, marca, serie, categoria, observaciones });
      } else {
        // fallback: create new with this id
        stored.push({ id: editId, nombre, marca, serie, categoria, estado: 'disponible', observaciones });
      }
      savePersisted(stored);
      showToast('Cambios guardados.', 'success');
      setTimeout(() => window.location.href = '../listado-inventario/listado_inventario.html', 700);
      return;
    }

    // Create new record
    const newId = 'INV-' + String(Date.now()).slice(-6);
    const record = { id: newId, nombre, marca, serie, categoria, estado: 'disponible', observaciones };
    stored.push(record);
    savePersisted(stored);
    showToast('Equipo guardado.', 'success');
    setTimeout(() => window.location.href = '../listado-inventario/listado_inventario.html', 700);
  });
</script>

</body>
</html>
