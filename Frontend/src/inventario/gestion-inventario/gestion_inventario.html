<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Inventario - UniGear Admin</title>
  <link rel="stylesheet" href="../../../compartido/estilos-base/tokens.css">
  <link rel="stylesheet" href="../../../compartido/componentes-ui/sidebar/sidebar.css">
  <link rel="stylesheet" href="gestion_inventario.css">
</head>
<body>
  <div class="ripple-background" aria-hidden="true">
    <div class="circle xxlarge shade1"></div>
    <div class="circle xlarge shade2"></div>
    <div class="circle large shade3"></div>
    <div class="circle medium shade4"></div>
    <div class="circle small shade5"></div>
  </div>

  <main class="main">
    <div id="topbar-sentinel"></div>
    <div class="topbar" id="topbar">
      <div>
        <div class="breadcrumb">Administración <span class="sep">/</span> Gestión de Inventario</div>
        <div class="page-title">Gestión de Inventario</div>
      </div>
      <div class="topbar-right">
        <a class="tb-action" href="../../usuarios/perfil/perfil_usuario.html">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 21v-1a7 7 0 0114 0v1"/>
          </svg>
          <span>Mi cuenta</span>
        </a>
      </div>
    </div>

    <div class="main-grid">
      <div class="card table-card">
        <div class="table-head">
          <div class="table-title">Inventario</div>
          <a class="table-link" href="#">Ver todo <span class="arrow">→</span></a>
        </div>
        <div id="tablaInventario">
          <div class="empty-state">Cargando...</div>
        </div>
      </div>

      <div class="card entregas-card">
        <div class="entregas-head">
          <div class="entregas-title">Acciones</div>
          <a class="table-link" href="#">Gestionar <span class="arrow">→</span></a>
        </div>
        <div id="listaInventario">
          <div class="empty-state">Cargando...</div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="gestion_inventario.js"></script>
</body>
</html>
