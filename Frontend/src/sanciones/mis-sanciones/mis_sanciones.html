<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UniGear — Mis sanciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../compartido/estilos-base/tokens.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: var(--font-body);
    background: var(--off-white);
    color: var(--text);
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4, .page-title, .summary-value, .empty-title { font-family: var(--font-display); }
  a { text-decoration: none; color: inherit; }
  button { font-family: inherit; cursor: pointer; }

  .main { margin-left: var(--sidebar-w); padding: 22px 30px 60px; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 22px; flex-wrap: wrap; gap: 12px;
  }
  .breadcrumb { font-size: 12px; color: var(--text-muted); }
  .breadcrumb .sep { margin: 0 6px; }
  .page-title { font-size: 20px; font-weight: 700; color: var(--navy); margin-top: 4px; letter-spacing: -0.3px; }

  .card {
    background: var(--card);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-lg);
    padding: 22px;
  }

  /* Resumen */
  .summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin-bottom: 22px;
  }
  .summary-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: box-shadow 220ms cubic-bezier(0.25, 1, 0.5, 1);
  }
  .summary-card:hover { box-shadow: var(--shadow-xl); }
  .summary-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 6px;
  }
  .summary-value {
    font-size: 24px; font-weight: 700;
    color: var(--navy); letter-spacing: -0.4px;
    font-variant-numeric: tabular-nums;
  }
  .summary-value.debt   { color: var(--error-text); }
  .summary-value.zero   { color: var(--success-text); }
  .summary-icon {
    width: 46px; height: 46px;
    border-radius: 12px;
    display: grid; place-items: center;
    background: var(--teal-50); color: var(--teal);
  }
  .summary-icon.warn { background: var(--error-bg); color: var(--error-text); }
  .summary-icon.ok   { background: var(--success-bg); color: var(--success-text); }

  /* Filtros */
  .filters {
    display: flex; gap: 8px; margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .chip {
    font-size: 12.5px; font-weight: 600;
    color: var(--text-light);
    background: var(--card);
    border: 1px solid var(--border);
    padding: 7px 14px;
    border-radius: 999px;
    transition: all 180ms cubic-bezier(0.25, 1, 0.5, 1);
  }
  .chip:hover { border-color: var(--teal-100); color: var(--teal-dark); }
  .chip.active {
    background: var(--teal); color: #fff; border-color: var(--teal);
  }
  .chip .count {
    margin-left: 6px;
    font-size: 11px;
    background: rgba(0,0,0,0.06);
    padding: 1px 6px;
    border-radius: 999px;
  }
  .chip.active .count { background: rgba(255,255,255,0.22); }

  /* Lista de sanciones */
  .list-card { padding: 0; overflow: hidden; }
  .sanction {
    display: grid;
    grid-template-columns: auto 1fr auto auto;
    align-items: center;
    gap: 18px;
    padding: 18px 22px;
    border-bottom: 1px solid var(--border-soft);
    transition: background 160ms cubic-bezier(0.25, 1, 0.5, 1);
  }
  .sanction:last-child { border-bottom: none; }
  .sanction:hover { background: var(--gray-50); }
  .s-icon {
    width: 42px; height: 42px;
    border-radius: 10px;
    background: var(--error-bg);
    color: var(--error-text);
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .s-icon.paid { background: var(--success-bg); color: var(--success-text); }
  .s-meta { min-width: 0; }
  .s-reason {
    font-size: 14px; font-weight: 600; color: var(--navy);
    margin-bottom: 3px;
  }
  .s-sub {
    font-size: 12px; color: var(--text-muted);
    display: flex; gap: 10px; flex-wrap: wrap;
  }
  .s-sub .dot { color: var(--gray-300); }
  .s-amount {
    font-family: var(--font-display);
    font-size: 17px; font-weight: 700;
    color: var(--gray-900);
    text-align: right;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .s-amount.paid { color: var(--success-text); }
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 700;
    padding: 4px 10px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .badge.pending { background: var(--error-bg); color: var(--error-text); }
  .badge.paid    { background: var(--success-bg); color: var(--success-text); }

  .btn-pay {
    background: var(--teal);
    color: #fff;
    border: none;
    font-weight: 600;
    font-size: 12.5px;
    padding: 8px 14px;
    border-radius: 9px;
    display: inline-flex; align-items: center; gap: 6px;
    box-shadow: var(--shadow-teal);
    transition: background 180ms cubic-bezier(0.25, 1, 0.5, 1),
                transform 180ms cubic-bezier(0.25, 1, 0.5, 1);
  }
  .btn-pay:hover { background: var(--teal-dark); transform: translateY(-1px); }
  .btn-pay:active { transform: translateY(0); }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 60px 22px;
  }
  .empty-icon {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: var(--success-bg);
    color: var(--success-text);
    display: grid; place-items: center;
    margin: 0 auto 18px;
  }
  .empty-title {
    font-size: 19px; font-weight: 700;
    color: var(--navy); margin-bottom: 6px;
  }
  .empty-desc {
    font-size: 13.5px; color: var(--text-muted);
    max-width: 380px; margin: 0 auto;
    line-height: 1.6;
  }

  @media (max-width: 1100px) {
    .summary { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 768px) {
    .main { margin-left: 0; padding: 16px; }
    .summary { grid-template-columns: 1fr; }
    .sanction {
      grid-template-columns: auto 1fr;
      grid-template-rows: auto auto;
      padding: 16px;
    }
    .sanction .s-amount,
    .sanction .badge,
    .sanction .btn-pay {
      grid-column: 2;
      justify-self: start;
    }
  }
</style>
</head>
<body>

<!-- Sidebar inyectado -->

<main class="main">
  <div class="topbar">
    <div>
      <div class="breadcrumb">Páginas <span class="sep">/</span> Sanciones</div>
      <div class="page-title">Mis sanciones</div>
    </div>
  </div>

  <!-- Resumen -->
  <section class="summary">
    <div class="card summary-card">
      <div>
        <div class="summary-label">Deuda total</div>
        <div class="summary-value zero" id="totalDebt">0,00 €</div>
      </div>
      <div class="summary-icon ok" id="debtIcon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
    </div>
    <div class="card summary-card">
      <div>
        <div class="summary-label">Pendientes</div>
        <div class="summary-value" id="pendingCount">0</div>
      </div>
      <div class="summary-icon warn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      </div>
    </div>
    <div class="card summary-card">
      <div>
        <div class="summary-label">Pagadas</div>
        <div class="summary-value" id="paidCount">0</div>
      </div>
      <div class="summary-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 12l2 2 4-4"/></svg>
      </div>
    </div>
  </section>

  <!-- Filtros -->
  <div class="filters" role="tablist" aria-label="Filtrar sanciones">
    <button class="chip active" data-filter="all" role="tab" aria-selected="true">
      Todas <span class="count" id="countAll">0</span>
    </button>
    <button class="chip" data-filter="pending" role="tab" aria-selected="false">
      Pendientes <span class="count" id="countPending">0</span>
    </button>
    <button class="chip" data-filter="paid" role="tab" aria-selected="false">
      Pagadas <span class="count" id="countPaid">0</span>
    </button>
  </div>

  <!-- Lista -->
  <section class="card list-card" id="sanctionList">
    <!-- Inyectado por JS -->
  </section>
</main>

<script type="module">
  import { auth } from '../../compartido/nucleo/auth.js';
  import { api } from '../../compartido/nucleo/api.js';
  import { mountSidebar } from '../../compartido/componentes-ui/sidebar/sidebar.js';

  const user = auth.requireAuth(['estudiante', 'profesor']);
  mountSidebar({ activePage: 'sanciones', basePath: '../..' });
  if (!user) { /* redirige */ } else { init(user); }

  async function init(user) {
    const fmtMoney = (n) => n.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
    const fmtDate = (iso) => new Date(iso).toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });

    const list = document.getElementById('sanctionList');

    let sanciones = [];
    try {
      sanciones = await api.getSanciones(user.id);
    } catch (err) {
      console.error('Error al cargar sanciones:', err);
      list.innerHTML = `<div class="empty"><div class="empty-title">No se pudieron cargar las sanciones</div><div class="empty-desc">${err.message}</div></div>`;
      return;
    }

    // Normalizar al formato que la vista espera
    const items = sanciones.map(s => ({
      id: s.id,
      motivo: s.motivo,
      prestamoId: s.prestamoId,
      material: s.materialName || 'Material',
      fecha: s.fechaInicio,
      importe: s.importeCentimos / 100,
      estado: s.pagada ? 'paid' : 'pending',
    }));

    const totals = items.reduce((acc, s) => {
      if (s.estado === 'pending') { acc.debt += s.importe; acc.pending += 1; }
      else acc.paid += 1;
      return acc;
    }, { debt: 0, pending: 0, paid: 0 });

    document.getElementById('totalDebt').textContent = fmtMoney(totals.debt);
    document.getElementById('totalDebt').classList.toggle('debt', totals.debt > 0);
    document.getElementById('totalDebt').classList.toggle('zero', totals.debt === 0);
    if (totals.debt > 0) {
      const icon = document.getElementById('debtIcon');
      icon.classList.remove('ok');
      icon.classList.add('warn');
      icon.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
    }
    document.getElementById('pendingCount').textContent = totals.pending;
    document.getElementById('paidCount').textContent = totals.paid;
    document.getElementById('countAll').textContent = items.length;
    document.getElementById('countPending').textContent = totals.pending;
    document.getElementById('countPaid').textContent = totals.paid;

    const renderEmpty = (filter) => {
      const titles = { all: 'Sin sanciones', pending: 'No tienes sanciones pendientes', paid: 'Aún no has pagado ninguna sanción' };
      const descs = {
        all: 'Cuando recibas una sanción aparecerá aquí. Devuelve siempre el material a tiempo y en buen estado para evitarlas.',
        pending: 'Estás al día con tus pagos. Sigue así.',
        paid: 'Cuando pagues una sanción aparecerá en esta lista.',
      };
      list.innerHTML = `
        <div class="empty">
          <div class="empty-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>
          </div>
          <div class="empty-title">${titles[filter]}</div>
          <div class="empty-desc">${descs[filter]}</div>
        </div>`;
    };

    const renderSanction = (s) => {
      const paid = s.estado === 'paid';
      const subParts = [];
      if (s.material) subParts.push(s.material);
      if (s.prestamoId) subParts.push(`Préstamo #${s.prestamoId}`);
      if (s.fecha) subParts.push(fmtDate(s.fecha));
      const sub = subParts.join('<span class="dot"> · </span>');

      return `
        <div class="sanction" data-estado="${s.estado}">
          <div class="s-icon ${paid ? 'paid' : ''}">
            ${paid
              ? '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg>'
              : '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>'}
          </div>
          <div class="s-meta">
            <div class="s-reason">${s.motivo}</div>
            <div class="s-sub">${sub}</div>
          </div>
          <div class="s-amount ${paid ? 'paid' : ''}">${fmtMoney(s.importe)}</div>
          ${paid
            ? '<span class="badge paid">Pagada</span>'
            : `<a class="btn-pay" href="../../pagos/checkout/checkout.html?id=${s.id}">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>
                Pagar ahora
              </a>`}
        </div>`;
    };

    const render = (filter) => {
      const list2 = filter === 'all' ? items : items.filter(s => s.estado === filter);
      if (list2.length === 0) { renderEmpty(filter); return; }
      list.innerHTML = list2.map(renderSanction).join('');
    };

    render('all');

    document.querySelectorAll('.chip[data-filter]').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.chip[data-filter]').forEach(c => {
          c.classList.remove('active');
          c.setAttribute('aria-selected', 'false');
        });
        chip.classList.add('active');
        chip.setAttribute('aria-selected', 'true');
        render(chip.dataset.filter);
      });
    });
  }
</script>

</body>
</html>
