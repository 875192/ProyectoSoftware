<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UniGear — Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../compartido/estilos-base/tokens.css">
<link rel="stylesheet" href="listado_materiales.css">
</head>
<body>

<div class="ripple-background" aria-hidden="true">
  <div class="circle xxlarge shade1"></div>
  <div class="circle xlarge shade2"></div>
  <div class="circle large shade3"></div>
  <div class="circle medium shade4"></div>
  <div class="circle small shade5"></div>
</div>

<!-- Sidebar inyectado por compartido/componentes-ui/sidebar/sidebar.js -->

<!-- ===== MAIN ===== -->
<main class="main">

  <!-- Topbar -->
  <div class="topbar">
    <div>
      <div class="breadcrumb">Páginas <span class="sep">/</span> Catálogo</div>
      <div class="page-title">Catálogo de materiales</div>
    </div>
    <div class="topbar-right">
      <a class="tb-action" href="../../usuarios/perfil/perfil_usuario.html">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0114 0v1"/></svg>
        <span>Mi Perfil</span>
      </a>
      <a class="tb-icon" href="../../notificaciones/bandeja-notificaciones/notificaciones_usuario.html">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
        <span class="notif-dot"></span>
      </a>
    </div>
  </div>

  <!-- ===== HERO: objeto más prestado ===== -->
  <section class="card hero" id="heroSection" hidden>
    <div class="hero-visual">
      <div class="hero-badge-float tl">
        <span class="flame">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2s4 4 4 9a4 4 0 01-8 0c0-2 1-3 1-5-2 1-5 4-5 8a8 8 0 0016 0c0-7-8-12-8-12z"/></svg>
        </span>
        En tendencia
      </div>
      <div class="hero-badge-float br">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2l3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1z"/></svg>
        Top 1 del mes
      </div>

      <div class="hero-object" id="heroIcon"></div>
    </div>

    <div class="hero-content">
      <div class="hero-eyebrow">
        <span class="dot"></span>
        Objeto más prestado
      </div>
      <h1 class="hero-title" id="heroTitle">—</h1>
      <p class="hero-desc" id="heroDesc">—</p>
      <p class="hero-summary" id="heroSummary"></p>

      <div class="hero-actions">
        <a class="btn-primary" id="heroSolicitar" href="#">
          Solicitar préstamo
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </a>
        <a class="btn-ghost" id="heroDetalles" href="#">Ver detalles</a>
      </div>
    </div>
  </section>

  <!-- ===== BUSCADOR ===== -->
  <div class="search-block">
    <div class="search-hero">
      <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input id="searchInput" type="text" placeholder="Busca un material… (ej. cámara, proyector, portátil)" autocomplete="off"/>
      <span class="kbd">⌘ K</span>
    </div>
  </div>

  <!-- ===== FILTROS POR CATEGORÍA ===== -->
  <div class="chips" id="chips">
    <button class="chip active" data-cat="todas">Todas <span class="count" id="count-todas">0</span></button>
  </div>

  <!-- ===== LISTA ===== -->
  <div class="list-header">
    <div>
      <div class="section-title">Lista de materiales</div>
      <div class="section-sub"><span id="resultCount">22</span> resultados disponibles para solicitar</div>
    </div>
    <select class="sort-select" id="sortSelect">
      <option value="popular">Más populares</option>
      <option value="az">Nombre (A → Z)</option>
      <option value="stock">Mayor disponibilidad</option>
    </select>
  </div>

  <div class="grid" id="grid"></div>

</main>

<script type="module" src="listado_materiales.js"></script>

</body>
</html>
