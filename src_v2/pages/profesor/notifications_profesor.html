  <style>
    .notif-card {
      padding: 1.25rem;
      border-bottom: 1px solid var(--slate-200);
      display: flex;
      gap: 1.25rem;
      align-items: flex-start;
      transition: background-color 0.2s;
    }
    .notif-card:last-child {
      border-bottom: none;
    }
    .notif-card:hover {
      background-color: var(--slate-50);
    }
    .notif-unread {
      background-color: var(--primary-50);
    }
    .notif-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .icon-info { background: #e0f2fe; color: #0284c7; }
    .icon-success { background: #dcfce7; color: #0369a1; }     
    .icon-warning { background: #fef3c7; color: #166534; }   /* Using green for success/ready */
    .icon-alert { background: #fee2e2; color: #991b1b; }      /* Red for alert/overdue */

    .notif-content {
      flex: 1;
    }
    .notif-title {
      font-weight: 600;
      color: var(--slate-900);
      margin-bottom: 0.25rem;
    }
    .notif-desc {
      color: var(--slate-600);
      font-size: 0.9rem;
      line-height: 1.5;
      margin-bottom: 0.5rem;
    }
    .notif-meta {
      font-size: 0.75rem;
      color: var(--slate-400);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .dot-unread {
      width: 8px;
      height: 8px;
      background-color: var(--primary-color);
      border-radius: 50%;
      flex-shrink: 0;
      margin-top: 20px;
    }
    
    .tab-btn {
      padding: 0.75rem 1.5rem;
      font-weight: 500;
      font-size: 0.95rem;
      color: var(--slate-500);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn:hover {
      color: var(--slate-800);
    }
    .tab-btn.active {
      color: var(--primary-color);
      border-bottom-color: var(--primary-color);
    }
    .badge {
      background: var(--primary-color);
      color: white;
      font-size: 0.75rem;
      padding: 0.1rem 0.5rem;
      border-radius: 99px;
      margin-left: 0.5rem;
    }
  </style>

</head>

      <main class="main-content">
        <div class="page-header" style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem;">
          <div>
            <h1 class="page-title" style="font-size: 2rem; margin-bottom: 0.5rem; letter-spacing: -0.02em;">Notificaciones</h1>
            <p class="page-subtitle">Avisos importantes sobre tus pr�stamos y el sistema.</p>

          <!-- Tabs -->
          <div style="display: flex; border-bottom: 1px solid var(--slate-200); padding: 0 1.5rem; background: #fff;">
            <button class="tab-btn active" data-filter="all">Todas</button>
            <button class="tab-btn" data-filter="unread">No le�das <span class="badge" id="unread-count">0</span></button>
          </div>

          <!-- Notification List -->
          <div id="notifications-list">
            <!-- JS populates -->

          <!-- Empty State -->

              <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--slate-400)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>

            <p style="color: var(--slate-500); font-size: 0.95rem; max-width: 300px; margin: 0 auto;">Est�s al d�a con todos tus avisos y alertas del sistema de pr�stamos.</p>

  <script type="module">
    import { auth } from '../../js/core/auth.js';
    import { db } from '../../js/core/db.js';
    import { ui } from '../../js/components/ui.js';

    // 1. Auth Guard
    const user = auth.requireAuth(['estudiante', 'profesor']);
    if (!user) throw new Error("Not authenticated");

    // 2. Setup Base UI
    ui.setupLayout(user);

    // 3. Mock Data
    /* Real logic would pull from db: db.filter('notifications', n => n.userId === user.id) */
    let notifications = [
      {
        id: 'n1',
        title: 'Solicitud Aprobada',
        message: 'Tu solicitud para el equipo "Port�til Dell XPS 15" ha sido aprobada. Puedes pasar a recogerlo por el almac�n.',
        date: 'Hoy, 10:30',
        type: 'success', // success, info, alert, warning
        read: false,
        link: 'requests_profesor.html'
      },
      {
        id: 'n2',
        title: 'Recordatorio de devoluci�n',
        message: 'Recuerda que debes devolver "Kits Arduino Uno" ma�ana antes de las 14:00h. Si necesitas m�s tiempo, solicita una pr�rroga.',
        date: 'Ayer, 09:15',
        type: 'warning',
        read: false,
        link: 'requests_profesor.html'
      },
      {
        id: 'n3',
        title: 'Mantenimiento programado',
        message: 'El sistema estar� fuera de servicio este viernes de 22:00 a 24:00 por tareas de mantenimiento en el servidor central.',
        date: 'Hace 3 d�as',
        type: 'info',
        read: true,
        link: null
      },
      {
        id: 'n4',
        title: 'Retraso en devoluci�n',
        message: 'Atenci�n: Tienes material (C�mara Canon EOS R5) pendiente de devoluci�n cuya fecha expir� ayer. Por favor, regulariza la situaci�n.',
        date: 'Hace 1 semana',
        type: 'alert',
        read: true,
        link: 'requests_profesor.html'
      }
    ];

    // Elements
    const listContainer = document.getElementById('notifications-list');
    const emptyState = document.getElementById('empty-state');
    const btnMarkAll = document.getElementById('btn-mark-all');
    const tabs = document.querySelectorAll('.tab-btn');
    const unreadCount = document.getElementById('unread-count');

    let currentFilter = 'all';

    function getIcon(type) {
      switch(type) {
        case 'success':
          return `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`;
        case 'warning':
          return `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`;
        case 'alert':
          return `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>`;
        case 'info':
        default:
          return `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>`;
      }
    }

    function renderNotifications() {
      const filtered = notifications.filter(n => {
        if(currentFilter === 'unread') return !n.read;
        return true;
      });

      const unreadTotal = notifications.filter(n => !n.read).length;
      unreadCount.textContent = unreadTotal;
      if(unreadTotal === 0) unreadCount.style.display = 'none';
      else unreadCount.style.display = 'inline-block';

      if(filtered.length === 0) {
        listContainer.style.display = 'none';
        emptyState.style.display = 'block';
        return;
      }
      
      listContainer.style.display = 'block';
      emptyState.style.display = 'none';

      listContainer.innerHTML = filtered.map(n => `
        <div class="notif-card ${!n.read ? 'notif-unread' : ''}" style="${n.link ? 'cursor: pointer;' : ''}" data-id="${n.id}" data-link="${n.link || ''}">
          <div class="notif-icon icon-${n.type}">
            ${getIcon(n.type)}
          </div>
          <div class="notif-content">
            <div class="notif-title">${n.title}</div>
            <div class="notif-desc">${n.message}</div>
            <div class="notif-meta">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
              ${n.date}
            </div>
          </div>
          ${!n.read ? '<div class="dot-unread"></div>' : ''}
        </div>
      `).join('');

      // Add listeners to cards
      document.querySelectorAll('.notif-card').forEach(card => {
        card.addEventListener('click', (e) => {
          const id = card.dataset.id;
          const link = card.dataset.link;
          
          // Mark as read
          const notif = notifications.find(n => n.id === id);
          if (notif && !notif.read) {
            notif.read = true;
            renderNotifications();
          }

          if(link) {
            window.location.href = link;
          }
        });
      });
    }

    // Tab bindings
    tabs.forEach(tab => {
      tab.addEventListener('click', (e) => {
        tabs.forEach(t => t.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.dataset.filter;
        renderNotifications();
      });
    });

    // Mark all as read
    btnMarkAll.addEventListener('click', () => {
      let changed = false;
      notifications.forEach(n => {
        if(!n.read) {
          n.read = true;
          changed = true;
        }
      });
      if(changed) {
        renderNotifications();
      }
    });

    // Initial render
    renderNotifications();
  </script>
